<!-- 新增记账表单组件｜成员G -->
<div class="form-container">
  <h3>📝 新增记账记录</h3>
  <form id="billAddForm">
    <div class="form-row">
      <label>记账日期</label>
      <input type="date" id="inputDate">
      <span class="err-tip" id="errDate"></span>
    </div>

    <div class="form-row">
      <label>收支类型</label>
      <div class="radio-wrap">
        <label><input type="radio" name="billType" value="expense" checked> 支出</label>
        <label><input type="radio" name="billType" value="income"> 收入</label>
      </div>
      <span class="err-tip" id="errType"></span>
    </div>

    <div class="form-row">
      <label>分类</label>
      <select id="selectCategory">
        <option value="">请选择分类</option>
      </select>
      <span class="err-tip" id="errCategory"></span>
    </div>

    <div class="form-row">
      <label>金额（元）</label>
      <input type="text" id="inputAmount" placeholder="例如：35.50">
      <span class="err-tip" id="errAmount"></span>
    </div>

    <div class="form-row">
      <label>备注（选填）</label>
      <textarea id="inputRemark" rows="2" placeholder="添加备注信息"></textarea>
    </div>

    <div class="form-row">
      <button type="submit" id="btnSubmit">提交记录</button>
    </div>
  </form>
</div>

<style>
.form-container {
  padding: 20px;
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  max-width: 520px;
}
.form-row {
  margin-bottom: 14px;
}
.form-row label {
  display: block;
  margin-bottom: 5px;
  font-weight: 500;
}
#inputDate, #selectCategory, #inputAmount, #inputRemark {
  width: 100%;
  box-sizing: border-box;
  padding: 8px 10px;
  border: 1px solid #ccc;
  border-radius: 6px;
}
.radio-wrap {
  display: flex;
  gap: 24px;
}
.err-tip {
  display: block;
  color: #dc2626;
  font-size: 13px;
  min-height:18px;
}
#btnSubmit {
  background-color: #2563eb;
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 6px;
  cursor: pointer;
}
#btnSubmit:hover {
  background-color: #1d4ed8;
}
</style>

<script>
// 分类配置
const categoryDict = {
  "expense": ["饮食", "交通", "房租", "购物", "娱乐"],
  "income": ["工资", "奖金", "兼职", "红包"]
};
const form = document.getElementById("billAddForm");
const typeRadios = document.querySelectorAll('input[name="billType"]');
const categorySel = document.getElementById("selectCategory");
const todayStr = new Date().toISOString().split('T')[0];
document.getElementById("inputDate").value = todayStr;

// 根据收支类型更新下拉选项
function renderCategory(typeVal) {
  categorySel.innerHTML = `<option value="">请选择分类</option>`;
  categoryDict[typeVal].forEach(item => {
    const opt = document.createElement("option");
    opt.value = item;
    opt.innerText = item;
    categorySel.appendChild(opt);
  })
}
renderCategory("expense");
typeRadios.forEach(radio => {
  radio.onchange = () => renderCategory(radio.value);
})

// 清空全部错误提示
function clearAllError() {
  document.querySelectorAll(".err-tip").forEach(el => el.innerText = "");
}

// 表单校验函数
function checkForm(data) {
  clearAllError();
  let pass = true;
  if (!data.date) {
    document.getElementById("errDate").innerText = "请选择日期";
    pass = false;
  }
  if (!data.type) {
    document.getElementById("errType").innerText = "请选择收入或支出";
    pass = false;
  }
  if (!data.category) {
    document.getElementById("errCategory").innerText = "请选择分类";
    pass = false;
  }
  const regMoney = /^\d+(\.\d{1,2})?$/;
  if (!data.amount.trim()) {
    document.getElementById("errAmount").innerText = "请填写金额";
    pass = false;
  } else if (!regMoney.test(data.amount.trim())) {
    document.getElementById("errAmount").innerText = "金额格式错误，最多两位小数";
    pass = false;
  } else {
    const numAmt = Number(data.amount.trim());
    if (numAmt <= 0) {
      document.getElementById("errAmount").innerText = "金额必须大于0";
      pass = false;
    }
  }
  return pass;
}

// 表单提交事件
form.onsubmit = async function (e) {
  e.preventDefault();
  const rawData = {
    date: document.getElementById("inputDate").value,
    type: document.querySelector('input[name="billType"]:checked').value,
    category: categorySel.value,
    amount: document.getElementById("inputAmount").value.trim(),
    remark: document.getElementById("inputRemark").value.trim()
  };
  // 本地校验
  if (!checkForm(rawData)) return;

  // 【重点】元 → 分，转为整数
  const yuan = Number(rawData.amount);
  const fen = Math.round(yuan * 100);

  const sendBody = {
    date: rawData.date,
    type: rawData.type,
    category: rawData.category,
    amount: fen,
    remark: rawData.remark
  };

  try {
    const resp = await fetch("http://127.0.0.1:8000/api/records/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(sendBody)
    });
    const resJson = await resp.json();
    if (resp.ok) {
      alert("✅ 添加账单成功！");
      form.reset();
      document.getElementById("inputDate").value = todayStr;
      renderCategory("expense");
      // 预留钩子：H同学账单列表刷新回调
      // if(window.refreshBillList) window.refreshBillList();
    } else {
      alert("❌ 添加失败：" + (resJson.detail || "参数错误"));
    }
  } catch (err) {
    alert("⚠️ 请求失败，请确认后端FastAPI服务已启动（127.0.0.1:8000）");
    console.error(err);
  }
}
</script>
